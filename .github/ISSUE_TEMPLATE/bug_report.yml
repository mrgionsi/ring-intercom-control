name: Bug report
description: Report a reproducible bug in ring-intercom-control
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is happening and what did you expect?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps so maintainers can reproduce quickly.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Run ...
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / errors
      description: Paste relevant console, backend, or CI logs.
      render: shell

  - type: input
    id: branch
    attributes:
      label: Branch / commit
      description: Branch name or commit SHA where issue occurs.
      placeholder: dev / main / abc123

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - backend
        - frontend
        - ci
        - docs
        - security
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser, docker/non-docker.
      placeholder: |
        OS: ...
        Node: ...
        Browser: ...
        Mode: local dev / docker / ci
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Validation
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I can reproduce this consistently.
          required: false
