name: Feature request
description: Propose an enhancement for ring-intercom-control
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want.
      placeholder: What should be built and how should it work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternatives or trade-offs.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - backend
        - frontend
        - ci
        - docs
        - security
        - devops
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - low
        - medium
        - high

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we verify this is done?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2

  - type: checkboxes
    id: checks
    attributes:
      label: Validation
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I read CONTRIBUTING.md and this request aligns with project scope.
          required: true
