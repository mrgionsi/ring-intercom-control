name-template: 'v$NEXT_VERSION'
tag-template: 'v$NEXT_VERSION'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
no-changes-template: '- No changes'

categories:
  - title: 'Features'
    labels:
      - feat
      - feature
  - title: 'Fixes'
    labels:
      - fix
      - bug
      - hotfix
  - title: 'Operations'
    labels:
      - ops
      - ci
      - chore
  - title: 'Documentation'
    labels:
      - docs

change-title-escapes: '\<*_&'

template: |
  ## What Changed

  $CHANGES

  ## Container Images

  Container images are published by the `Publish Container Images` workflow.

version-resolver:
  major:
    labels:
      - breaking
      - breaking-change
  minor:
    labels:
      - feat
      - feature
  patch:
    labels:
      - fix
      - bug
      - hotfix
      - ops
      - ci
      - chore
      - docs
  default: patch
