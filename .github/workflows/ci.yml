name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-session-secret
      MASTER_KEY: 7sQb2MQ4mL/QBjxJgRLZ2TLGnciP9f4pBf3MQXybP5Q=
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: $2a$12$tGQSEUZiEq0SSh0Rt9rSlucHJqSrXVh5mbLK4AqYWiIISapwRZCUy
      CLIENT_ORIGIN: http://localhost:5173
      PORT: 3001
      DB_PATH: ./data.db
      SMOKE_USERNAME: admin
      SMOKE_PASSWORD: ci-admin-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Test backend
        run: npm run test --if-present
        working-directory: backend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Test frontend
        run: npm run test --if-present
        working-directory: frontend

      - name: Start backend
        run: |
          nohup node backend/dist/index.js > backend.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:3001/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not start in time"
          cat backend.log
          exit 1

      - name: Run smoke test
        run: node scripts/smoke-test.mjs --base-url http://localhost:3001 --username "$SMOKE_USERNAME" --password "$SMOKE_PASSWORD"

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log
          if-no-files-found: ignore
