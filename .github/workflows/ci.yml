name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-session-secret
      MASTER_KEY: ${{ secrets.MASTER_KEY }}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
      CLIENT_ORIGIN: http://localhost:5173
      PORT: 3001
      DB_PATH: ./data.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Test backend
        run: npm run test --if-present
        working-directory: backend

  frontend-tests:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-session-secret
      MASTER_KEY: ${{ secrets.MASTER_KEY }}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
      CLIENT_ORIGIN: http://localhost:5173
      PORT: 3001
      DB_PATH: ./data.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Test frontend
        run: npm run test --if-present
        working-directory: frontend

  smoke-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    env:
      SESSION_SECRET: ci-session-secret
      MASTER_KEY: ${{ secrets.MASTER_KEY }}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
      CLIENT_ORIGIN: http://localhost:5173
      PORT: 3001
      DB_PATH: ./data.db
      SMOKE_USERNAME: admin
      SMOKE_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Start backend
        run: |
          nohup node backend/dist/index.js > backend.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:3001/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not start in time"
          cat backend.log
          exit 1

      - name: Run smoke test
        run: node scripts/smoke-test.mjs --base-url http://localhost:3001 --username "$SMOKE_USERNAME" --password "$SMOKE_PASSWORD"

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log
          if-no-files-found: ignore

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    env:
      SESSION_SECRET: ci-session-secret
      MASTER_KEY: ${{ secrets.MASTER_KEY || '7sQb2MQ4mL/QBjxJgRLZ2TLGnciP9f4pBf3MQXybP5Q=' }}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH || '$2a$12$PIYufC/q7nqCUcvQd9Czf.mEBMdx7reA7I1TVHoiUYNF6CjVC6bcq' }}
      CLIENT_ORIGIN: http://127.0.0.1:5173
      PORT: 3001
      DB_PATH: ./data.db
      E2E_USERNAME: admin
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'e2e-admin-pass' }}
      E2E_ADMIN_PASSWORD_HASH: ${{ secrets.E2E_ADMIN_PASSWORD_HASH || '$2a$12$PIYufC/q7nqCUcvQd9Czf.mEBMdx7reA7I1TVHoiUYNF6CjVC6bcq' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run frontend e2e tests
        run: npm run test:e2e
        working-directory: frontend

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
