name: Publish Container Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional docker/release tag (example: beta, alpha, 1.0.0)'
        required: false
        type: string
      publish_latest:
        description: 'Also publish latest tag'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Build and Push (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
            image: ring-intercom-control-backend
          - component: frontend
            context: frontend
            image: ring-intercom-control-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare dynamic tags
        id: vars
        shell: bash
        run: |
          EXTRA_TAGS=""
          RELEASE_LABEL="main-${GITHUB_RUN_NUMBER}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            EXTRA_TAGS=$'type=raw,value=${{ inputs.release_tag }}\n'
            RELEASE_LABEL="${{ inputs.release_tag }}"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" || "${{ inputs.publish_latest }}" == "true" ]]; then
            EXTRA_TAGS+=$'type=raw,value=latest\n'
          fi
          {
            echo "extra_tags<<EOF"
            printf "%s" "$EXTRA_TAGS"
            echo
            echo "EOF"
            echo "release_label=$RELEASE_LABEL"
          } >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            ${{ steps.vars.outputs.extra_tags }}
            type=sha,format=short
            type=raw,value=main-${{ github.run_number }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write release manifest
        run: |
          mkdir -p release-manifests
          {
            echo "## ${{ matrix.component }}"
            echo "- Image: \`ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Tags:"
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              echo "  - \`$tag\`"
            done <<< "${{ steps.meta.outputs.tags }}"
          } > release-manifests/${{ matrix.component }}.md

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ matrix.component }}
          path: release-manifests/${{ matrix.component }}.md

  draft-release:
    name: Draft Release
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Prepare release metadata
        id: release_vars
        shell: bash
        run: |
          TAG="containers-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NAME="Container publish ${GITHUB_RUN_NUMBER}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            TAG="containers-${{ inputs.release_tag }}"
            NAME="Container publish ${{ inputs.release_tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Download manifests
        uses: actions/download-artifact@v4
        with:
          pattern: release-manifest-*
          merge-multiple: true
          path: release-manifests

      - name: Build release notes
        run: |
          {
            echo "# Container image publish"
            echo
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            cat release-manifests/backend.md
            echo
            cat release-manifests/frontend.md
          } > RELEASE_NOTES.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.release_vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_vars.outputs.name }}
          body_path: RELEASE_NOTES.md
