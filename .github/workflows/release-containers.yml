name: Publish Container Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build and Push (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
            image: ring-intercom-control-backend
          - component: frontend
            context: frontend
            image: ring-intercom-control-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=main-${{ github.run_number }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Write release manifest
        run: |
          mkdir -p release-manifests
          {
            echo "## ${{ matrix.component }}"
            echo "- Image: \`ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Tags:"
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              echo "  - \`$tag\`"
            done <<< "${{ steps.meta.outputs.tags }}"
          } > release-manifests/${{ matrix.component }}.md

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ matrix.component }}
          path: release-manifests/${{ matrix.component }}.md

  draft-release:
    name: Draft Release
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Download manifests
        uses: actions/download-artifact@v4
        with:
          pattern: release-manifest-*
          merge-multiple: true
          path: release-manifests

      - name: Build release notes
        run: |
          {
            echo "# Container image publish"
            echo
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            cat release-manifests/backend.md
            echo
            cat release-manifests/frontend.md
          } > RELEASE_NOTES.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: containers-${{ github.run_id }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Container publish ${{ github.run_number }}
          body_path: RELEASE_NOTES.md
