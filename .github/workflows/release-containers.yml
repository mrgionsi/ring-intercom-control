name: Publish Container Images

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional docker/release tag (example: beta, alpha, 1.0.0)'
        required: false
        type: string
      publish_latest:
        description: 'Also publish latest tag'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Build and Push (${{ matrix.component }})
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
            image: ring-intercom-control-backend
          - component: frontend
            context: frontend
            image: ring-intercom-control-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare dynamic tags
        id: vars
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          COMPONENT_VERSION="$(node -p "require('./${{ matrix.context }}/package.json').version")"
          EXTRA_TAGS=""
          RELEASE_LABEL="main-${GITHUB_RUN_NUMBER}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "$RELEASE_TAG" ]]; then
            EXTRA_TAGS+=$'type=raw,value='"$RELEASE_TAG"$'\n'
            RELEASE_LABEL="$RELEASE_TAG"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" || "$PUBLISH_LATEST" == "true" ]]; then
            EXTRA_TAGS+=$'type=raw,value=latest\n'
          fi
          EXTRA_TAGS+=$'type=raw,value='"$COMPONENT_VERSION"$'\n'
          {
            echo "extra_tags<<EOF"
            printf "%s" "$EXTRA_TAGS"
            echo
            echo "EOF"
            echo "release_label=$RELEASE_LABEL"
            echo "component_version=$COMPONENT_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            ${{ steps.vars.outputs.extra_tags }}
            type=sha,format=short
            type=raw,value=main-${{ github.run_number }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write release manifest
        run: |
          mkdir -p release-manifests
          {
            echo "## ${{ matrix.component }}"
            echo "- Image: \`ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}\`"
            echo "- Version: \`${{ steps.vars.outputs.component_version }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Tags:"
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              echo "  - \`$tag\`"
            done <<< "${{ steps.meta.outputs.tags }}"
          } > release-manifests/${{ matrix.component }}.md

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ matrix.component }}
          path: release-manifests/${{ matrix.component }}.md

  draft-release:
    name: Draft Release
    runs-on: ubuntu-latest
    needs: build-and-push
    if: >
      needs.build-and-push.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        !contains(join(github.event.pull_request.labels.*.name, ','), 'skip-changelog')
      )
    environment: production
    steps:
      - name: Prepare release metadata
        id: release_vars
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="containers-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NAME="Container publish ${GITHUB_RUN_NUMBER}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "$RELEASE_TAG" ]]; then
            TAG="containers-${RELEASE_TAG}"
            NAME="Container publish ${RELEASE_TAG}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Download manifests
        id: download_manifests
        uses: actions/download-artifact@v4
        with:
          pattern: release-manifest-*
          merge-multiple: true
          path: release-manifests

      - name: Verify manifests exist
        run: |
          shopt -s nullglob
          files=(release-manifests/*.md)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release manifests found"
            exit 1
          fi

      - name: Build release notes
        run: |
          {
            echo "# Container image publish"
            echo
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            shopt -s nullglob
            files=(release-manifests/*.md)
            mapfile -t files < <(printf '%s\n' "${files[@]}" | sort)
            for file in "${files[@]}"; do
              cat "$file"
              echo
            done
          } > RELEASE_NOTES.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.release_vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_vars.outputs.name }}
          body_path: RELEASE_NOTES.md
