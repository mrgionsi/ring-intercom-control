services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: ring-intercom-backend
    restart: unless-stopped
    environment:
      DB_PATH: /data/data.db
      SESSION_SECRET: ${SESSION_SECRET}
      MASTER_KEY: ${MASTER_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      PORT: 3001
    ports:
      - "${BACKEND_PORT}:3001"
    volumes:
      - ring-intercom-data:/data

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: ring-intercom-frontend
    restart: unless-stopped
    environment:
      PORT: 5173
      BACKEND_URL: http://backend:3001
      PROXY_TIMEOUT_MS: ${PROXY_TIMEOUT_MS}
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - backend

volumes:
  ring-intercom-data:
