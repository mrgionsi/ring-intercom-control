services:
  backend:
    # Healthcheck uses "/nodejs/bin/node" because the default published BACKEND_IMAGE
    # is distroless and does not provide a shell/PATH-resolved `node` binary.
    # If you override BACKEND_IMAGE with a non-distroless image, update the
    # healthcheck command path accordingly (for example to `node`).
    image: ${BACKEND_IMAGE}
    container_name: ring-intercom-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_PATH: ${DB_PATH}
      SESSION_DB_FILE: ${SESSION_DB_FILE}
      TRUST_PROXY: ${TRUST_PROXY}
      SESSION_SECRET: ${SESSION_SECRET}
      MASTER_KEY: ${MASTER_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      PORT: 3001
    ports:
      - "${BACKEND_PORT}:3001"
    volumes:
      - ring-intercom-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    # Healthcheck uses "/nodejs/bin/node" because the default published FRONTEND_IMAGE
    # is distroless and does not provide a shell/PATH-resolved `node` binary.
    # If you override FRONTEND_IMAGE with a non-distroless image, update the
    # healthcheck command path accordingly (for example to `node`).
    image: ${FRONTEND_IMAGE}
    container_name: ring-intercom-frontend
    restart: unless-stopped
    environment:
      PORT: 5173
      BACKEND_URL: ${BACKEND_URL}
      PROXY_TIMEOUT_MS: ${PROXY_TIMEOUT_MS}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES}
    ports:
      - "${FRONTEND_PORT}:5173"
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "require('http').get('http://127.0.0.1:5173/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ring-intercom-data:
